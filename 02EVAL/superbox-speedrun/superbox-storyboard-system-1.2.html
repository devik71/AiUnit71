      external: { bg: "#0A1A0A", border: "#4AC262", text: "#8BFFA8", label: "EXTERNAL" },
    };

    const PLAYERS = {
      p1: { color: "#00FFFF", label: "P1" },
      p2: { color: "#FF95DA", label: "P2" },
    };

    // ── Precompute how many times each glyph appears across all steps ──
    const GLYPH_STEP_COUNTS = {};
    SCENARIOS.forEach(s => s.steps.forEach(step => {
      GLYPH_STEP_COUNTS[step.glyph] = (GLYPH_STEP_COUNTS[step.glyph] || 0) + 1;
    }));

    function stepKey(scenarioId, i) { return `step-${scenarioId}-${i}`; }
    function taskKey(scenarioId, i) { return `${scenarioId}-${i}`; }

    // ── GLYPH ICON ────────────────────────────────────────────────────
    function GlyphIcon({ type, size = 28 }) {
      const s = size, h = s / 2;
      const icons = {
        body_front: <g>
          <rect x={4} y={2} width={s - 8} height={s - 4} rx={3} fill="none" stroke="currentColor" strokeWidth={2} />
          <rect x={8} y={6} width={s - 16} height={s - 16} rx={1} fill="none" stroke="currentColor" strokeWidth={1.5} />
          <line x1={h - 3} y1={s - 6} x2={h - 3} y2={s - 2} stroke="currentColor" strokeWidth={1.5} />
          <line x1={h + 3} y1={s - 6} x2={h + 3} y2={s - 2} stroke="currentColor" strokeWidth={1.5} />
        </g>,
        body_side_r: <g>
          <rect x={6} y={2} width={s - 12} height={s - 4} rx={3} fill="none" stroke="currentColor" strokeWidth={2} />
          <line x1={8} y1={h} x2={s - 8} y2={h - 4} stroke="currentColor" strokeWidth={1.5} />
          <line x1={h} y1={s - 6} x2={h} y2={s - 2} stroke="currentColor" strokeWidth={1.5} />
        </g>,
        body_side_l: <g>
          <rect x={6} y={2} width={s - 12} height={s - 4} rx={3} fill="none" stroke="currentColor" strokeWidth={2} />
          <line x1={s - 8} y1={h} x2={8} y2={h - 4} stroke="currentColor" strokeWidth={1.5} />
          <line x1={h} y1={s - 6} x2={h} y2={s - 2} stroke="currentColor" strokeWidth={1.5} />
        </g>,
        body_split: <g>
          <rect x={2} y={4} width={12} height={s - 8} rx={2} fill="none" stroke="currentColor" strokeWidth={1.5} strokeDasharray="2 2" />
          <rect x={s - 14} y={4} width={12} height={s - 8} rx={2} fill="none" stroke="currentColor" strokeWidth={1.5} strokeDasharray="2 2" />
          <line x1={h} y1={6} x2={h} y2={s - 6} stroke="currentColor" strokeWidth={1} strokeDasharray="3 3" opacity={0.4} />
        </g>,
        body_merge: <g>
          <rect x={2} y={4} width={12} height={s - 8} rx={2} fill="none" stroke="currentColor" strokeWidth={1.5} />
          <rect x={s - 14} y={4} width={12} height={s - 8} rx={2} fill="none" stroke="currentColor" strokeWidth={1.5} />
          <path d={`M14 ${h} L${s - 14} ${h}`} stroke="currentColor" strokeWidth={1.5} />
        </g>,
        body_melt: <g>
          <path d={`M6 4 L6 ${s - 10} Q${h} ${s} ${s - 6} ${s - 10} L${s - 6} 4 Z`} fill="none" stroke="currentColor" strokeWidth={2} />
          <circle cx={h - 4} cy={12} r={2} fill="currentColor" />
          <circle cx={h + 4} cy={12} r={2} fill="currentColor" />
        </g>,
        body_glitch: <g>
          <rect x={4} y={2} width={s - 8} height={s - 4} rx={3} fill="none" stroke="currentColor" strokeWidth={2} strokeDasharray="4 2" />
          <line x1={2} y1={h} x2={s - 2} y2={h} stroke="currentColor" strokeWidth={1} opacity={0.5} />
          <rect x={6} y={h - 2} width={8} height={4} fill="currentColor" opacity={0.3} />
          <rect x={s - 14} y={h + 2} width={6} height={3} fill="currentColor" opacity={0.3} />
        </g>,
        body_shake: <g>
          <rect x={6} y={4} width={s - 12} height={s - 8} rx={3} fill="none" stroke="currentColor" strokeWidth={2} />
          <path d={`M3 ${h - 4} L1 ${h} L3 ${h + 4}`} stroke="currentColor" strokeWidth={1.5} fill="none" />
          <path d={`M${s - 3} ${h - 4} L${s - 1} ${h} L${s - 3} ${h + 4}`} stroke="currentColor" strokeWidth={1.5} fill="none" />
        </g>,
        body_tense: <g>
          <rect x={4} y={2} width={s - 8} height={s - 4} rx={3} fill="none" stroke="currentColor" strokeWidth={2.5} />
          <line x1={2} y1={4} x2={6} y2={8} stroke="currentColor" strokeWidth={1.5} />
          <line x1={s - 2} y1={4} x2={s - 6} y2={8} stroke="currentColor" strokeWidth={1.5} />
          <line x1={2} y1={s - 4} x2={6} y2={s - 8} stroke="currentColor" strokeWidth={1.5} />
          <line x1={s - 2} y1={s - 4} x2={s - 6} y2={s - 8} stroke="currentColor" strokeWidth={1.5} />
        </g>,
        body_lean_fwd: <g>
          <rect x={4} y={6} width={s - 8} height={s - 10} rx={3} fill="none" stroke="currentColor" strokeWidth={2} transform={`rotate(-15 ${h} ${h})`} />
        </g>,
      };
      const icon = icons[type];
      return (
        <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`} style={{ display: "block" }}>
          {icon || (
            <text x={h} y={h + 4} textAnchor="middle" fontSize={9} fill="currentColor" fontFamily="monospace">
              {GLYPHS[type]?.id || "?"}
            </text>
          )}
        </svg>
      );
    }

    // ── STORYBOARD STRIP (with step checkmarks) ───────────────────────
    function StoryboardStrip({ scenario, checked, onToggleStep, playerId }) {
      return (
        <div style={{ background: "#080808", border: "1px solid #1A1A1A", borderLeft: `4px solid ${scenario.color}`, borderRadius: 6, padding: "12px 16px", marginBottom: 8 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <span style={{ background: scenario.color, color: "#000", fontWeight: 900, fontSize: 13, width: 26, height: 26, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              {scenario.id}
            </span>
            <span style={{ fontWeight: 700, fontSize: 13, color: "#FFFFFF" }}>{scenario.title}</span>
            <span style={{ fontSize: 11, color: "#FFFFFF", fontStyle: "italic" }}>{scenario.titleEn}</span>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 4, overflowX: "auto", padding: "8px 0", borderTop: "1px dashed #1A1A1A", borderBottom: "1px dashed #1A1A1A" }}>
            {scenario.steps.map((step, i) => {
              const lc = LAYER_COLORS[step.layer] || LAYER_COLORS.external;
              const key = stepKey(scenario.id, i);
              const myDone = !!checked[key]?.[playerId];
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 2 }}>
                  {i > 0 && <span style={{ color: "#FFFFFF", fontSize: 14, margin: "0 2px" }}>—</span>}
                  <div
                    onClick={() => onToggleStep(key)}
                    title={`${step.note}\n[${lc.label}]\nClick to mark done`}
                    style={{
                      background: myDone ? lc.bg : lc.bg,
                      border: `1.5px solid ${myDone ? lc.border : lc.border + "55"}`,
                      borderRadius: 4,
                      padding: "4px 6px",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      minWidth: 52,
                      cursor: "pointer",
                      position: "relative",
                      opacity: myDone ? 0.55 : 1,
                      transition: "opacity 0.15s, border-color 0.15s",
                    }}>
                    {/* checkmark badge */}
                    {myDone && (
                      <div style={{ position: "absolute", top: 2, right: 2, width: 11, height: 11, borderRadius: 2, background: PLAYERS[playerId].color, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        <svg width="8" height="8" viewBox="0 0 8 8"><polyline points="1,4 3,6 7,2" stroke="#000" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>
                      </div>
                    )}
                    <div style={{ color: myDone ? lc.text + "88" : lc.text, marginBottom: 2, textDecoration: myDone ? "line-through" : "none" }}>
                      {GLYPHS[step.glyph]
                        ? <span style={{ fontSize: 16 }}>{GLYPHS[step.glyph].label}</span>
                        : <GlyphIcon type={step.glyph} size={26} />}
                    </div>
                    <span style={{ fontSize: 7, color: lc.text, opacity: myDone ? 0.35 : 0.7, textTransform: "uppercase", letterSpacing: 0.5 }}>{lc.label}</span>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ marginTop: 6, fontSize: 10, color: "#FFFFFF", lineHeight: 1.6 }}>
            {scenario.steps.map((s, i) => {
              const done = !!checked[stepKey(scenario.id, i)]?.[playerId];
              return (
                <span key={i}>
                  {i > 0 && <span style={{ color: "#FFFFFF" }}> → </span>}
                  <span style={{ color: done ? "#444" : (s.layer === "body" ? "#FFFFFF" : LAYER_COLORS[s.layer]?.border) || "#FFFFFF", textDecoration: done ? "line-through" : "none" }}>
                    {s.note}
                  </span>
                </span>
              );
            })}
          </div>
        </div>
      );
    }

    // ── SETUP PANEL ───────────────────────────────────────────────────
    function SetupPanel({ playerId, serverHost, onSetPlayer, onSetHost, onDone }) {
      const [hostInput, setHostInput] = useState(serverHost);
      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.95)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ background: "#050505", border: "2px solid #00FFFF", borderRadius: 10, padding: 32, width: 380, maxWidth: "90vw", boxShadow: "0 0 40px #00FFFF22" }}>
            <div style={{ fontSize: 17, fontWeight: 900, color: "#00FFFF", marginBottom: 4, letterSpacing: 2 }}>MULTIPLAYER SETUP</div>
            <div style={{ fontSize: 10, color: "#FFFFFF", marginBottom: 24, letterSpacing: 1 }}>REAL-TIME SSE SYNC</div>

            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 11, color: "#FFFFFF", marginBottom: 8, textTransform: "uppercase", letterSpacing: 1 }}>You are</div>
              <div style={{ display: "flex", gap: 8 }}>
                {["p1", "p2"].map(pid => (
                  <button key={pid} onClick={() => onSetPlayer(pid)}
                    style={{ flex: 1, padding: "11px 0", background: playerId === pid ? PLAYERS[pid].color : "#111", color: playerId === pid ? "#000" : PLAYERS[pid].color, border: `2px solid ${PLAYERS[pid].color}`, borderRadius: 6, fontSize: 15, fontWeight: 900, cursor: "pointer", fontFamily: "inherit", letterSpacing: 2 }}>
                    {PLAYERS[pid].label}
                  </button>
                ))}
              </div>
            </div>

            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 11, color: "#FFFFFF", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>Sync server host</div>
              <div style={{ fontSize: 10, color: "#FFFFFF", marginBottom: 8, lineHeight: 1.7 }}>
                P1: run <span style={{ color: "#00FFFF" }}>node server.js</span> in terminal.<br />
                P2: enter P1's local IP (e.g. <span style={{ color: "#FF95DA" }}>192.168.1.X</span>).<br />
                <span style={{ color: "#FFFFFF" }}>Server pushes state via SSE — instant sync.</span>
              </div>
              <input
                value={hostInput}
                onChange={e => setHostInput(e.target.value)}
                placeholder="localhost or 192.168.1.X"
                style={{ width: "100%", background: "#0A0A0A", border: "1.5px solid #222", borderRadius: 4, color: "#EEE", fontFamily: "inherit", fontSize: 13, padding: "9px 10px", outline: "none" }}
              />
            </div>

            <div style={{ fontSize: 10, color: "#FFFFFF", marginBottom: 20, lineHeight: 1.6 }}>
              No server? Works offline — state saved locally only.
            </div>

            <button
              onClick={() => { onSetHost(hostInput); onDone(); }}
              style={{ width: "100%", padding: "13px 0", background: "#00FFFF", color: "#000", border: "none", borderRadius: 6, fontSize: 14, fontWeight: 900, cursor: "pointer", fontFamily: "inherit", letterSpacing: 2 }}>
              START
            </button>
          </div>
        </div>
      );
    }

    // ── PROGRESS BAR ─────────────────────────────────────────────────
    function ProgressBar({ done, total, color, label }) {
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 130 }}>
          <span style={{ fontSize: 11, color, fontWeight: 700, minWidth: 22 }}>{label}</span>
          <div style={{ flex: 1, height: 5, background: "#111", borderRadius: 3, overflow: "hidden", minWidth: 60 }}>
            <div style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 3, transition: "width 0.3s ease", boxShadow: `0 0 6px ${color}88` }} />
          </div>
          <span style={{ fontSize: 10, color: "#FFFFFF", minWidth: 40 }}>{done}/{total}</span>
        </div>
      );
    }

    // ── MAIN APP ──────────────────────────────────────────────────────
    function App() {
      const [activeTab, setActiveTab] = useState("strips");
      const [filterLayer, setFilterLayer] = useState("all");
      const [showSetup, setShowSetup] = useState(true);
      const [playerId, setPlayerId] = useState(() => localStorage.getItem("sb_player") || "p1");
      const [serverHost, setServerHost] = useState(() => localStorage.getItem("sb_host") || "localhost");
      const [checked, setChecked] = useState(() => {
        try { return JSON.parse(localStorage.getItem("sb_checked") || "{}"); }
        catch { return {}; }
      });
      const [connStatus, setConnStatus] = useState("offline");

      const lastSyncRef = useRef(null);
      const esRef = useRef(null);

      useEffect(() => { localStorage.setItem("sb_player", playerId); }, [playerId]);
      useEffect(() => { localStorage.setItem("sb_host", serverHost); }, [serverHost]);
      useEffect(() => { localStorage.setItem("sb_checked", JSON.stringify(checked)); }, [checked]);

      const syncUrl = `http://${serverHost}:3001`;

      // Initial snapshot pull
      const pullState = useCallback(async () => {
        try {
          const res = await fetch(`${syncUrl}/state`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          const snap = JSON.stringify(data.checked);
          if (snap !== lastSyncRef.current) {
            lastSyncRef.current = snap;
            setChecked(data.checked || {});
          }
          setConnStatus("ok");
        } catch { setConnStatus("error"); }
      }, [syncUrl]);

      // Push state change to server → server broadcasts SSE to all clients
      const pushState = useCallback(async (newChecked) => {
        try {
          setConnStatus("syncing");
          await fetch(`${syncUrl}/state`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ checked: newChecked }),
          });
          setConnStatus("ok");
        } catch { setConnStatus("error"); }
      }, [syncUrl]);

      // SSE connection — real-time push from server
      useEffect(() => {
        if (showSetup) return;
        pullState();

        if (esRef.current) { esRef.current.close(); esRef.current = null; }

        const es = new EventSource(`${syncUrl}/events`);
        esRef.current = es;

        es.onopen = () => setConnStatus("ok");
        es.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            const snap = JSON.stringify(data.checked);
            if (snap !== lastSyncRef.current) {
              lastSyncRef.current = snap;
              setChecked(data.checked || {});
            }
            setConnStatus("ok");
          } catch { }
        };
        es.onerror = () => setConnStatus("error"); // EventSource auto-reconnects

        return () => { es.close(); esRef.current = null; };
      }, [showSetup, syncUrl]);

      // Unified toggle for both tasks and steps
      function toggleItem(key) {
        setChecked(prev => {
          const entry = prev[key] || {};
          const updated = { ...prev, [key]: { ...entry, [playerId]: !entry[playerId] } };
          pushState(updated);
          return updated;
        });
      }

      // ── Task list (nonBodyTasks only) ──
      const allTasks = SCENARIOS.flatMap(s =>
        s.nonBodyTasks.map((task, i) => ({
          scenario: s.title, scenarioId: s.id, color: s.color, task,
          key: taskKey(s.id, i),
          layer: task.startsWith("Faceplate") ? "faceplate"
            : task.startsWith("Face anim") ? "face_anim"
              : "external",
        }))
      );

      const filtered = filterLayer === "all" ? allTasks : allTasks.filter(t => t.layer === filterLayer);
      const total = allTasks.length;
      const p1Done = allTasks.filter(t => checked[t.key]?.p1).length;
      const p2Done = allTasks.filter(t => checked[t.key]?.p2).length;

      const counts = {
        faceplate: allTasks.filter(t => t.layer === "faceplate").length,
        face_anim: allTasks.filter(t => t.layer === "face_anim").length,
        external: allTasks.filter(t => t.layer === "external").length,
      };

      // Glyph step progress for legend
      function getGlyphProgress(glyphKey) {
        let done = 0;
        const total = GLYPH_STEP_COUNTS[glyphKey] || 0;
        SCENARIOS.forEach(s => s.steps.forEach((step, i) => {
          if (step.glyph === glyphKey && checked[stepKey(s.id, i)]?.[playerId]) done++;
        }));
        return { done, total };
      }

      const connDot = { offline: "#333", syncing: "#00FFFF", ok: "#4CAF50", error: "#FF3333" }[connStatus];
      const otherPid = playerId === "p1" ? "p2" : "p1";

      return (
        <div style={{ fontFamily: "'Courier New',monospace", background: "#000000", color: "#FFFFFF", minHeight: "100vh" }}>

          {showSetup && (
            <SetupPanel
              playerId={playerId} serverHost={serverHost}
              onSetPlayer={setPlayerId} onSetHost={setServerHost}
              onDone={() => setShowSetup(false)}
            />
          )}

          {/* HEADER */}
          <div style={{ background: "#000000", borderBottom: "2px solid #00FFFF", padding: "16px 24px", boxShadow: "0 2px 20px #00FFFF11" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              <div style={{ width: 44, height: 44, background: "#00FFFF", borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 18, color: "#000", flexShrink: 0, boxShadow: "0 0 12px #00FFFF66" }}>
                SB
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 17, fontWeight: 900, letterSpacing: 2, color: "#00FFFF" }}>SUPERBOX STORYBOARD SYSTEM</div>
                <div style={{ fontSize: 10, color: "#FFFFFF", marginTop: 2, letterSpacing: 1 }}>BODY → FACEPLATE → FACE ANIM → EXTERNAL OBJECTS</div>
              </div>

              <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <ProgressBar done={p1Done} total={total} color={PLAYERS.p1.color} label="P1" />
                  <ProgressBar done={p2Done} total={total} color={PLAYERS.p2.color} label="P2" />
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  {["p1", "p2"].map(pid => (
                    <button key={pid} onClick={() => setPlayerId(pid)}
                      style={{ background: playerId === pid ? PLAYERS[pid].color : "#0A0A0A", color: playerId === pid ? "#000" : PLAYERS[pid].color, border: `1.5px solid ${PLAYERS[pid].color}`, borderRadius: 4, padding: "3px 10px", fontSize: 11, fontWeight: 900, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, boxShadow: playerId === pid ? `0 0 8px ${PLAYERS[pid].color}66` : "none" }}>
                      {PLAYERS[pid].label}
                    </button>
                  ))}
                </div>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }} title={connStatus}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: connDot, boxShadow: `0 0 6px ${connDot}` }} />
                  <button onClick={() => setShowSetup(true)}
                    style={{ background: "none", border: "none", color: "#FFFFFF", fontSize: 9, cursor: "pointer", fontFamily: "inherit", padding: 0, letterSpacing: 1 }}>
                    SETUP
                  </button>
                </div>
              </div>
            </div>

            {/* TABS */}
            <div style={{ display: "flex", gap: 6, marginTop: 14, flexWrap: "wrap" }}>
              {[
                { id: "strips", label: "Storyboard Strips" },
                { id: "tasks", label: `Tasks (${p1Done + p2Done}/${total * 2})` },
                { id: "legend", label: "Glyph Legend" },
              ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  style={{ background: activeTab === tab.id ? "#00FFFF" : "#0A0A0A", color: activeTab === tab.id ? "#000" : "#FFFFFF", border: `1px solid ${activeTab === tab.id ? "#00FFFF" : "#333"}`, borderRadius: 4, padding: "7px 14px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, boxShadow: activeTab === tab.id ? "0 0 10px #00FFFF44" : "none" }}>
                  {tab.label}
                </button>
              ))}
            </div>
          </div>

          {/* CONTENT */}
          <div style={{ padding: "16px 24px", maxWidth: 980, margin: "0 auto" }}>

            {/* ── STRIPS ── */}
            {activeTab === "strips" && (
              <div>
                <div style={{ fontSize: 10, color: "#FFFFFF", marginBottom: 12, letterSpacing: 1 }}>
                  {SCENARIOS.length} SCENARIOS — click step to mark done · checkmark = your progress
                </div>
                {SCENARIOS.map(s => (
                  <StoryboardStrip
                    key={s.id}
                    scenario={s}
                    checked={checked}
                    onToggleStep={toggleItem}
                    playerId={playerId}
                  />
                ))}
              </div>
            )}

            {/* ── TASKS ── */}
            {activeTab === "tasks" && (
              <div>
                <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
                  {[
                    { id: "all", label: "All", count: total, color: "#00FFFF" },
                    { id: "faceplate", label: "Faceplate", count: counts.faceplate, color: LAYER_COLORS.faceplate.border },
                    { id: "face_anim", label: "Face Anim", count: counts.face_anim, color: LAYER_COLORS.face_anim.border },
                    { id: "external", label: "External", count: counts.external, color: LAYER_COLORS.external.border },
                  ].map(f => (
                    <button key={f.id} onClick={() => setFilterLayer(f.id)}
                      style={{ background: filterLayer === f.id ? f.color : "#0A0A0A", color: filterLayer === f.id ? "#000" : f.color, border: `1.5px solid ${f.color}`, borderRadius: 4, padding: "5px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", boxShadow: filterLayer === f.id ? `0 0 8px ${f.color}55` : "none" }}>
                      {f.label} ({f.count})
                    </button>
                  ))}
                  <div style={{ marginLeft: "auto", display: "flex", gap: 14, fontSize: 11 }}>
                    <span style={{ color: PLAYERS.p1.color }}>P1: {filtered.filter(t => checked[t.key]?.p1).length}/{filtered.length}</span>
                    <span style={{ color: PLAYERS.p2.color }}>P2: {filtered.filter(t => checked[t.key]?.p2).length}/{filtered.length}</span>
                  </div>
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  {filtered.map(t => {
                    const lc = LAYER_COLORS[t.layer];
                    const myCheck = !!checked[t.key]?.[playerId];
                    const othCheck = !!checked[t.key]?.[otherPid];
                    const bothDone = checked[t.key]?.p1 && checked[t.key]?.p2;
                    return (
                      <div key={t.key} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 12px", background: bothDone ? "#030A03" : lc.bg, border: `1px solid ${bothDone ? "#4CAF5022" : lc.border + "20"}`, borderRadius: 4, borderLeft: `3px solid ${t.color}`, opacity: myCheck && !bothDone ? 0.7 : 1, transition: "all 0.2s" }}>

                        {/* My checkbox */}
                        <button onClick={() => toggleItem(t.key)} title={`Mark done (${PLAYERS[playerId].label})`}
                          style={{ width: 20, height: 20, borderRadius: 3, border: `2px solid ${PLAYERS[playerId].color}`, background: myCheck ? PLAYERS[playerId].color : "transparent", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, padding: 0, boxShadow: myCheck ? `0 0 6px ${PLAYERS[playerId].color}66` : "none" }}>
                          {myCheck && <svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#000" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>}
                        </button>

                        {/* Other player */}
                        <div title={`${PLAYERS[otherPid].label}: ${othCheck ? "done" : "not done"}`}
                          style={{ width: 20, height: 20, borderRadius: 3, border: `2px solid ${PLAYERS[otherPid].color}`, background: othCheck ? PLAYERS[otherPid].color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, opacity: 0.7 }}>
                          {othCheck && <svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#000" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>}
                        </div>

                        <span style={{ fontSize: 10, color: t.color, fontWeight: 700, minWidth: 20, textAlign: "center" }}>#{t.scenarioId}</span>
                        <span style={{ fontSize: 9, color: lc.text, opacity: 0.5, textTransform: "uppercase", minWidth: 64, letterSpacing: 0.5 }}>{lc.label}</span>
                        <span style={{ fontSize: 12, color: bothDone ? "#4CAF50" : lc.text, flex: 1, textDecoration: myCheck ? "line-through" : "none", opacity: myCheck ? 0.5 : 1 }}>
                          {t.task}
                        </span>
                        {bothDone && <span style={{ fontSize: 9, color: "#4CAF50", fontWeight: 700, letterSpacing: 1, flexShrink: 0 }}>DONE</span>}
                      </div>
                    );
                  })}
                </div>

                <div style={{ marginTop: 14, fontSize: 10, color: "#FFFFFF", display: "flex", gap: 14, flexWrap: "wrap" }}>
                  <span><span style={{ color: PLAYERS[playerId].color, fontWeight: 700 }}>Left box</span> = your check ({PLAYERS[playerId].label})</span>
                  <span><span style={{ color: PLAYERS[otherPid].color, fontWeight: 700 }}>Right box</span> = other player</span>
                  <span style={{ color: "#4CAF50" }}>Both checked = DONE</span>
                </div>
              </div>
            )}

            {/* ── LEGEND ── */}
            {activeTab === "legend" && (
              <div>
                <div style={{ fontSize: 10, color: "#FFFFFF", marginBottom: 16, letterSpacing: 1 }}>
                  VISUAL NOTATION — counter = your checked steps / total uses · all done = crossed out
                </div>

                {Object.entries({
                  "Body Poses": Object.entries(GLYPHS).filter(([k]) => k.startsWith("body_")),
                  "Faceplate States": Object.entries(GLYPHS).filter(([k]) => k.startsWith("face_")),
                  "Eye Tracking (Face Anim)": Object.entries(GLYPHS).filter(([k]) => k.startsWith("eyes_")),
                  "Hands / Appendages": Object.entries(GLYPHS).filter(([k]) => k.startsWith("hand_")),
                  "External Objects": Object.entries(GLYPHS).filter(([k]) => k.startsWith("obj_")),
                  "Effects & Transitions": Object.entries(GLYPHS).filter(([k]) => k.startsWith("fx_") || k.startsWith("flow_")),
                }).map(([group, items]) => (
                  <div key={group} style={{ marginBottom: 20 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: "#00FFFF", marginBottom: 8, borderBottom: "1px solid #0A2A2A", paddingBottom: 4, letterSpacing: 2 }}>
                      {group}
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 4 }}>
                      {items.map(([key, val]) => {
                        const prog = getGlyphProgress(key);
                        const allDone = prog.total > 0 && prog.done === prog.total;
                        const hasProg = prog.total > 0;
                        const pctColor = prog.done === 0 ? "#FFFFFF"
                          : allDone ? "#00FFFF"
                            : "#FF95DA";
                        return (
                          <div key={key} style={{
                            display: "flex",
                            alignItems: "center",
                            gap: 10,
                            padding: "6px 10px",
                            background: allDone ? "#050505" : "#080808",
                            borderRadius: 3,
                            fontSize: 11,
                            border: `1px solid ${allDone ? "#00FFFF22" : "#111"}`,
                            opacity: allDone ? 0.45 : 1,
                            transition: "opacity 0.3s",
                          }}>
                            {/* icon + counter */}
                            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", minWidth: 32, flexShrink: 0 }}>
                              <span style={{
                                fontSize: 18,
                                lineHeight: 1,
                                textDecoration: allDone ? "line-through" : "none",
                                textDecorationColor: "#00FFFF",
                                filter: allDone ? "grayscale(1)" : "none",
                              }}>
                                {val.label}
                              </span>
                              {hasProg && (
                                <span style={{
                                  fontSize: 8,
                                  fontWeight: 700,
                                  color: pctColor,
                                  letterSpacing: 0.5,
                                  marginTop: 2,
                                  lineHeight: 1,
                                  boxShadow: allDone ? `0 0 4px #00FFFF44` : "none",
                                }}>
                                  {prog.done}/{prog.total}
                                </span>
                              )}
                            </div>
                            {/* description */}
                            <span style={{
                              color: allDone ? "#555" : "#FFFFFF",
                              textDecoration: allDone ? "line-through" : "none",
                              textDecorationColor: "#555",
                              fontSize: 11,
                            }}>
                              {val.desc}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}

                {/* Layer color coding */}
                <div style={{ marginTop: 24 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: "#00FFFF", marginBottom: 8, borderBottom: "1px solid #0A2A2A", paddingBottom: 4, letterSpacing: 2 }}>Layer Color Coding</div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    {Object.entries(LAYER_COLORS).map(([k, v]) => (
                      <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 16px", background: v.bg, border: `2px solid ${v.border}`, borderRadius: 6, boxShadow: `0 0 8px ${v.border}33` }}>
                        <span style={{ color: v.text, fontWeight: 700, fontSize: 12, letterSpacing: 1 }}>{v.label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
